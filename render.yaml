services:
  - type: web
    name: qa-radar
    runtime: docker
    plan: free
    healthCheckPath: /health
    # As variáveis abaixo cobrem o que este Blueprint precisa. As seguintes
    # ficam de fora de propósito, não por esquecimento:
    #   QA_RADAR_ALLOW_PRIVATE_TARGETS — nunca deve ser true num deploy público.
    #   QA_RADAR_ENABLE_HISTORY — histórico compartilhado sem autenticação
    #     não deve ser exposto no deploy público (ver README, seção Segurança).
    #   QA_RADAR_MAX_CODE_EXECUTION_MS / MAX_CODE_OUTPUT_BYTES / MAX_CODE_MEMORY_MIB /
    #     MAX_CODEGEN_DURATION_MS — só têm efeito com o Modo Código habilitado.
    #   TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY — exigem um widget criado à
    #     mão no painel da Cloudflare; adicionar manualmente no Render antes de
    #     uma divulgação ampla do endereço público.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: QA_RADAR_CONCURRENCY
        value: 1
      - key: QA_RADAR_MAX_QUEUE_SIZE
        value: 5
      - key: QA_RADAR_RATE_LIMIT_MAX
        value: 5
      - key: QA_RADAR_RETENTION_MS
        value: 3600000
      - key: QA_RADAR_MAX_JOB_DURATION_MS
        value: 180000
      - key: QA_RADAR_MAX_SITEMAP_PAGES
        value: 5
      # As três abaixo ligam a Jornada hospedada e são gerenciadas no painel do
      # Render, não aqui: `sync: false` faz o Blueprint declarar a chave sem
      # ditar o valor. Fixar `value: false` neste arquivo já desligou a Jornada
      # em produção uma vez, porque todo sync do Blueprint sobrescrevia o que
      # estava no painel. Enquanto QA_RADAR_SANDBOX_URL/SIGNING_SECRET estiverem
      # vazias, a execução hospedada falha fechado com 503 e nunca cai para o
      # worker local. Ver README, "Publicar o runner em uma VM".
      - key: QA_RADAR_ENABLE_CODE_MODE
        sync: false
      - key: QA_RADAR_SANDBOX_URL
        sync: false
      - key: QA_RADAR_SANDBOX_SIGNING_SECRET
        sync: false
      - key: QA_RADAR_CODE_MODE_ADMIN_TOKEN
        generateValue: true
      - key: QA_RADAR_TRUST_PROXY
        value: true
