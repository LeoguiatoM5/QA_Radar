services:
  - type: web
    name: qa-radar
    runtime: docker
    plan: free
    # /ready, não /health: o healthCheckPath do Render decide se a instância
    # entra em serviço, o que é prontidão e não vivacidade. /health responde
    # 200 com o processo de pé mesmo sem diretório de resultados gravável.
    healthCheckPath: /ready
    # As variáveis abaixo cobrem o que este Blueprint precisa. As seguintes
    # ficam de fora de propósito, não por esquecimento:
    #   QA_RADAR_ALLOW_PRIVATE_TARGETS — nunca deve ser true num deploy público.
    #   QA_RADAR_ENABLE_HISTORY — histórico compartilhado sem autenticação
    #     não deve ser exposto no deploy público (ver README, seção Segurança).
    #   QA_RADAR_MAX_CODE_EXECUTION_MS / MAX_CODE_OUTPUT_BYTES / MAX_CODE_MEMORY_MIB /
    #     MAX_CODEGEN_DURATION_MS — só têm efeito com o Modo Código habilitado.
    #   TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY — exigem um widget criado à
    #     mão no painel da Cloudflare; adicionar manualmente no Render antes de
    #     uma divulgação ampla do endereço público.
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: QA_RADAR_CONCURRENCY
        value: 1
      - key: QA_RADAR_MAX_QUEUE_SIZE
        value: 5
      - key: QA_RADAR_RATE_LIMIT_MAX
        value: 5
      - key: QA_RADAR_RETENTION_MS
        value: 3600000
      - key: QA_RADAR_MAX_JOB_DURATION_MS
        value: 180000
      - key: QA_RADAR_MAX_SITEMAP_PAGES
        value: 5
      # As três abaixo ligam a Jornada hospedada e são gerenciadas no painel do
      # Render, não aqui: `sync: false` faz o Blueprint declarar a chave sem
      # ditar o valor. Fixar `value: false` neste arquivo já desligou a Jornada
      # em produção uma vez, porque todo sync do Blueprint sobrescrevia o que
      # estava no painel. Enquanto QA_RADAR_SANDBOX_URL/SIGNING_SECRET estiverem
      # vazias, a execução hospedada falha fechado com 503 e nunca cai para o
      # worker local. Ver README, "Publicar o runner em uma VM".
      - key: QA_RADAR_ENABLE_CODE_MODE
        sync: false
      - key: QA_RADAR_SANDBOX_URL
        sync: false
      - key: QA_RADAR_SANDBOX_SIGNING_SECRET
        sync: false
      - key: QA_RADAR_CODE_MODE_ADMIN_TOKEN
        generateValue: true
      - key: QA_RADAR_TRUST_PROXY
        value: true
      # Persistência, também gerenciada no painel pelo mesmo motivo das três
      # acima: são segredos e não podem viver neste arquivo. Todas vazias, o
      # produto roda em memória e em disco — que é o comportamento atual, com
      # a ressalva de que o disco do Render é efêmero e leva os relatórios
      # embora a cada deploy. Ver README, "Persistência" e "Artefatos duráveis".
      - key: QA_RADAR_DATABASE_URL
        sync: false
      # As três de storage andam juntas: preencher só parte delas faz o boot
      # falhar de propósito, em vez de mandar artefato para lugar nenhum.
      - key: QA_RADAR_STORAGE_BUCKET
        sync: false
      - key: QA_RADAR_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: QA_RADAR_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: QA_RADAR_STORAGE_ENDPOINT
        sync: false
      # Gerado pelo próprio Render: com ele o token de acesso passa a ser
      # derivado do id da análise, e a repetição de uma criação consegue
      # reemiti-lo depois de um reinício sem nada em texto claro no banco.
      # Trocar este valor invalida os tokens em circulação.
      - key: QA_RADAR_ACCESS_TOKEN_SECRET
        generateValue: true
      # Login por GitHub. Sem as duas, a entrada não aparece e o produto segue
      # anônimo: roda a análise e o token dela é o que abre o resultado. O
      # callback cadastrado no OAuth App precisa ser exatamente
      # https://qa-radar.onrender.com/api/v1/auth/github/callback
      - key: QA_RADAR_GITHUB_CLIENT_ID
        sync: false
      - key: QA_RADAR_GITHUB_CLIENT_SECRET
        sync: false
