name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar em ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check
      - name: Reportar cobertura de testes unitários (não bloqueante)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: npm run test:coverage

  integration:
    name: Integração Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:integration

  lighthouse:
    name: Integração Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:lighthouse

  persistence:
    name: Persistência (Postgres)
    runs-on: ubuntu-latest
    # Container de serviço só existe em runner Linux, por isso este job é
    # separado do `validate`, que também roda no Windows. Sem ele a
    # implementação Postgres do repositório nunca seria exercitada no CI: a
    # suíte padrão só cobre a de memória.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qaradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Subir MinIO como S3 compatível
        # Serviço avulso em vez de `services:`: a imagem precisa do argumento
        # `server /data`, e `services` não permite passar comando.
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sSf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
      - run: npm run test:persistence
        env:
          QA_RADAR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qaradar
          QA_RADAR_TEST_STORAGE_ENDPOINT: http://127.0.0.1:9000

  sandbox:
    name: Homologação do sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run sandbox:image
      - run: npm run sandbox:homologate

  action-smoke:
    name: Composite action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Executar action local
        id: qa-radar
        uses: ./
        with:
          url: https://example.com
          fail-on: none
          output-dir: qa-radar-action-smoke

      - name: Validar artefatos
        shell: bash
        env:
          REPORT_JSON: ${{ steps.qa-radar.outputs.report-json }}
          REPORT_HTML: ${{ steps.qa-radar.outputs.report-html }}
          REPORT_JUNIT: ${{ steps.qa-radar.outputs.report-junit }}
          REPORT_SARIF: ${{ steps.qa-radar.outputs.report-sarif }}
        run: |
          test -s "$REPORT_JSON"
          test -s "$REPORT_HTML"
          test -s "$REPORT_JUNIT"
          test -s "$REPORT_SARIF"
          node -e "const r=require('./'+process.argv[1]);if(r.schemaVersion!=='1.0'||r.version!=='3.2.0')process.exit(1)" "$REPORT_JSON"

      - name: Publicar smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qa-radar-action-smoke
          path: qa-radar-action-smoke/
          if-no-files-found: error
          retention-days: 7
